root = "."
tmp_dir = "tmp"

[build]
# Generate swagger docs and build the server
cmd = "go run github.com/swaggo/swag/cmd/swag@latest init -g cmd/delta/main.go -d ./,./pkg/delta/routes -o ./api && go build -o ./tmp/main ./cmd/delta"

# Binary name
bin = "tmp/main"

# Log name
log = "build-errors.log"

# Watch external directories/extensions
include_ext = ["go", "tpl", "tmpl", "html", "env", "toml"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "api", "scripts"]
exclude_file = []

delay = 1000 # Delay after file changes before rebuilding (in ms)
stop_on_error = true # Stop running old binary when build errors occur
send_interrupt = true # Send Interrupt signal before killing
kill_delay = 500 # Delay after sending Interrupt signal (in ms)

[log]
# Show log time
time = false

[color]
# Set color for different logs
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true
